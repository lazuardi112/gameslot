<!DOCTYPE html>
<html>
<head>
  <title>Login/Register</title>
</head>
<body>
  <h1>Register</h1>
  <form id="register-form">
    <label for="register-whatsapp">WhatsApp Number:</label>
    <input type="text" id="register-whatsapp" name="whatsapp_number" required><br><br>
    <button type="submit">Register</button>
  </form>

  <h1>Login</h1>
  <form id="login-form">
    <label for="login-whatsapp">WhatsApp Number:</label>
    <input type="text" id="login-whatsapp" name="whatsapp_number" required><br><br>
    <label for="otp">OTP:</label>
    <input type="text" id="otp" name="otp" required><br><br>
    <button type="submit">Login</button>
  </form>
  <p id="message"></p>

  <script src="index.js"></script>
</body>
</html>
