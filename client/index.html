<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
</head>
<body>
  <main class="container">
    <article>
      <h1>Register</h1>
      <form id="register-form">
        <label for="register-whatsapp">WhatsApp Number</label>
        <input type="text" id="register-whatsapp" name="whatsapp_number" placeholder="e.g., 6281234567890" required>
        <button type="submit">Register</button>
      </form>
    </article>
    <article>
      <h1>Login</h1>
      <form id="login-form">
        <label for="login-whatsapp">WhatsApp Number</label>
        <input type="text" id="login-whatsapp" name="whatsapp_number" placeholder="e.g., 6281234567890" required>
        <label for="otp">OTP</label>
        <input type="text" id="otp" name="otp" placeholder="Enter OTP" required>
        <button type="submit">Login</button>
      </form>
      <p id="message"></p>
    </article>
  </main>
  <script src="index.js"></script>
</body>
</html>
