<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
</head>
<body>
  <main class="container">
    <nav>
      <ul>
        <li><strong>Admin Dashboard</strong></li>
      </ul>
    </nav>
    <article>
      <h2>Settings</h2>
      <form id="api-settings-form">
        <label for="flutter-sdk-path">Flutter SDK Path</label>
        <input type="text" id="flutter-sdk-path" name="flutter-sdk-path" placeholder="/path/to/your/flutter" required>
        <button type="submit">Save Settings</button>
      </form>
    </article>
    <article>
      <h2>User App Limits</h2>
      <figure>
        <table role="grid">
          <thead>
            <tr>
              <th>User ID</th>
              <th>WhatsApp Number</th>
              <th>App Limit</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="user-list">
            <!-- User list will be populated here -->
          </tbody>
        </table>
      </figure>
    </article>
  </main>
  <script src="admin_dashboard.js"></script>
</body>
</html>
