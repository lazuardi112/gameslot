<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>WebApp Builder</strong></li>
            </ul>
            <ul>
                <li><a href="/login.html">Login</a></li>
                <li><a href="/register.html">Register</a></li>
            </ul>
        </nav>
        <article>
            <h1 class="text-center">Register</h1>
            <form id="registerForm">
                <label for="whatsapp_number">WhatsApp Number</label>
                <input type="text" id="whatsapp_number" name="whatsapp_number" placeholder="Enter your WhatsApp number" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a password" required>

                <button type="submit">Register</button>
            </form>
            <div id="message" class="text-center"></div>
            <p class="text-center">Already have an account? <a href="/login.html">Login here</a>.</p>
        </article>
    </main>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const whatsapp_number = document.getElementById('whatsapp_number').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ whatsapp_number, password })
                });

                const data = await response.json();

                if (response.status === 201) {
                    messageDiv.textContent = 'Registration successful! You can now log in.';
                    messageDiv.className = 'pico-color-green-500';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    messageDiv.textContent = `Error: ${data.error}`;
                    messageDiv.className = 'pico-color-red-500';
                }
            } catch (error) {
                messageDiv.textContent = 'An unexpected error occurred. Please try again.';
                messageDiv.className = 'pico-color-red-500';
            }
        });
    </script>
</body>
</html>
